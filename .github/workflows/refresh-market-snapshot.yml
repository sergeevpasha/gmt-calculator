name: Refresh market snapshot

# data/gomining-snapshot.json is what the site serves when api.gomining.com is
# unreachable. It is baked into the bundle at build time, so without this it only
# ever changes when someone refreshes it by hand, and a GoMining outage would
# quietly serve numbers that are months old.
#
# GoMining publishes the daily payout at roughly 03:31 UTC, so this runs after it
# and pushes the result, which is what deploys it.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-market-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Read GoMining
        run: yarn update-snapshot

      # The snapshot is normalized at module load, so a malformed one breaks the
      # build rather than one request. Fail here and keep the last good file.
      - name: Check the new snapshot still adds up
        run: yarn test

      - name: Commit and deploy when something changed
        run: |
          if git diff --quiet -- data/gomining-snapshot.json; then
            echo "GoMining returned the same figures, nothing to commit."
            exit 0
          fi
          payout=$(jq -r '.income.createdAt[0:10]' data/gomining-snapshot.json)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gomining-snapshot.json
          git commit -m "chore: refresh market snapshot to the ${payout} payout"
          git push
